services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
#if (IncludeAnyOrm || IncludeCaching || IncludeKeycloak)
    depends_on:
#if (IncludePostgreSql)
      - postgres
#endif
#if (IncludeSqlServer)
      - sqlserver
#endif
#if (IncludeMySql)
      - mysql
#endif
#if (IncludeCaching)
      - redis
#endif
#if (IncludeKeycloak)
      - keycloak
#endif
#endif

#if (IncludePostgreSql)
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
#endif

#if (IncludeSqlServer)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "your_password"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
#endif

#if (IncludeMySql)
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: your_password
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
#endif

#if (IncludeCaching)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
#endif

#if (IncludeKeycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
#endif

#if (IncludePostgreSql || IncludeSqlServer || IncludeMySql)
volumes:
#if (IncludePostgreSql)
  postgres-data:
#endif
#if (IncludeSqlServer)
  sqlserver-data:
#endif
#if (IncludeMySql)
  mysql-data:
#endif
#endif
